<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klavye Kahramanı - 1. Sınıf Türkçe Klavye Eğitimi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for cute icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Quicksand for kid-friendly legibility -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Animated background gradient */
        .bg-animated {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Key pulse effect for target key */
        .key-target {
            animation: pulse-glow 1.2s infinite ease-in-out;
            background-color: #facc15 !important;
            color: #1e293b !important;
            transform: scale(1.1);
            z-index: 10;
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.9);
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1.05); }
            50% { transform: scale(1.15); }
        }

        /* Correct & Wrong animations */
        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .bounce-success {
            animation: bounce-success 0.5s ease;
        }

        @keyframes bounce-success {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2) rotate(3deg); }
        }

        /* Balloon animation for Game Mode */
        .balloon {
            position: absolute;
            width: 70px;
            height: 85px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: white;
            box-shadow: inset -10px -10px 10px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .balloon::after {
            content: "";
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 12px solid inherit;
        }

        .balloon-string {
            position: absolute;
            bottom: -28px;
            left: 50%;
            width: 2px;
            height: 18px;
            background-color: rgba(255,255,255,0.7);
        }
    </style>
</head>
<body class="bg-animated min-h-screen flex flex-col items-center justify-between p-2 md:p-6 text-slate-800">

    <header class="w-full max-w-5xl bg-white/90 backdrop-blur-md rounded-3xl p-4 shadow-xl mb-4 flex flex-wrap items-center justify-between gap-4 border-4 border-amber-300">

    <style>
        /* Styling keys */

            background-color: #334155;

        }

    <script>
        // Data sets based on Turkish 1st Grade MEB Curriculum Order
        const DATA_SETS = {
            letters: [
                { title: "1. Grup (ANETİL)", items: ["A", "N", "E", "T", "İ", "L"] },
                { title: "2. Grup (OKUMIR)", items: ["O", "K", "U", "M", "I", "R"] },
                { title: "3. Grup (ÜKYSÖZ)", items: ["Ü", "S", "Ö", "Z", "Y", "B"] },
                { title: "4. Grup (ÇĞPCDJ)", items: ["Ç", "Ğ", "P", "C", "D", "J", "Ş", "H"] }
            ],
            syllables: [
                { title: "Basit Heceler", items: ["EL", "AL", "ET", "AT", "İL", "EK", "OK", "UN"] },
                { title: "İki Harfli Heceler", items: ["LA", "LE", "Lİ", "MA", "ME", "KA", "KE", "TA"] },
                { title: "Üç Harfli Heceler", items: ["LAL", "LAK", "TEK", "KAT", "MAT", "SÜT", "ÇOK"] }
            ],
            words: [
                { title: "Kolay Kelimeler", items: [
                    { word: "ANNE", emoji: "👩" },
                    { word: "BABA", emoji: "👨" },
                    { word: "OKUL", emoji: "🏫" },
                    { word: "KEDİ", emoji: "🐱" },
                    { word: "ELMA", emoji: "🍎" },
                    { word: "SÜT", emoji: "🥛" },
                    { word: "KİTAP", emoji: "📚" },
                    { word: "GÜNEŞ", emoji: "☀️" },
                    { word: "AĞAÇ", emoji: "🌳" }
                ]}
            ],
            sentences: [
                { title: "1. Sınıf Cümleleri", items: [
                    "Ali ata bak.",
                    "Işık ılık süt iç.",
                    "Emel eve gel.",
                    "Ömer okula koş.",
                    "Kedi ip ile oynar."
                ]}
            ]
        };

        // Application State
        let currentMode = 'letters';
        let groupIndex = 0;
        let itemIndex = 0;
        let charIndex = 0;
        let totalScore = 0;
        let soundEnabled = true;

        // Game Mode State
        let gameActive = false;
        let balloons = [];
        let gameScore = 0;
        let gameMissed = 0;
        let gameInterval = null;
        let spawnInterval = null;

        // Audio Effects using Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                    osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                } else if (type === 'level') {
                    // Fanfare notes
                    [261.63, 329.63, 392.00, 523.25].forEach((freq, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.frequency.value = freq;
                        g.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.08);
                        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.08 + 0.2);
                        o.start(audioCtx.currentTime + i * 0.08);
                        o.stop(audioCtx.currentTime + i * 0.08 + 0.2);
                    });
                }
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('sound-btn');
            btn.innerHTML = soundEnabled ? '<i class="fa-solid fa-volume-high"></i>' : '<i class="fa-solid fa-volume-xmark text-red-500"></i>';
        }

        // Mode Switching Logic
        function setMode(mode) {
            currentMode = mode;
            groupIndex = 0;
            itemIndex = 0;
            charIndex = 0;

            // Highlight mode buttons
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.className = 'mode-btn px-4 py-2 rounded-2xl font-bold text-sm md:text-base transition-all bg-white text-indigo-700 hover:bg-indigo-50 border-2 border-indigo-200';
            });

            const activeBtn = document.getElementById(`btn-${mode}`);
            if (mode === 'game') {
                activeBtn.className = 'mode-btn px-4 py-2 rounded-2xl font-bold text-sm md:text-base transition-all bg-pink-600 text-white shadow-lg ring-4 ring-pink-300';
                document.getElementById('practice-card').classList.add('hidden');
                document.getElementById('game-card').classList.remove('hidden');
                stopGame();
            } else {
                activeBtn.className = 'mode-btn px-4 py-2 rounded-2xl font-bold text-sm md:text-base transition-all bg-indigo-600 text-white shadow-lg';
                document.getElementById('practice-card').classList.remove('hidden');
                document.getElementById('game-card').classList.add('hidden');
                stopGame();
                renderCurrentTarget();
            }
        }

        // Get Current Target String
        function getCurrentItem() {
            const group = DATA_SETS[currentMode][groupIndex];
            if (!group) return "";
            const item = group.items[itemIndex];
            if (typeof item === 'object') return item.word;
            return item;
        }

        // Render Text and Virtual Keyboard Highlight
        function renderCurrentTarget() {
            const group = DATA_SETS[currentMode][groupIndex];
            const rawItem = group.items[itemIndex];
            const targetText = getCurrentItem();

            // Update Level Badge & Progress
            document.getElementById('level-badge').innerText = `${group.title}`;
            document.getElementById('progress-text').innerText = `${itemIndex + 1} / ${group.items.length}`;
            
            // Progress Bar
            const progressPct = ((itemIndex) / group.items.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPct}%`;

            // Display Emoji hint if word mode
            const hintElem = document.getElementById('image-hint');
            if (currentMode === 'words' && rawItem.emoji) {
                hintElem.innerText = rawItem.emoji;
                hintElem.classList.remove('hidden');
            } else {
                hintElem.classList.add('hidden');
            }

            // Render Spans for Text Display
            const displayElem = document.getElementById('text-display');
            displayElem.innerHTML = '';

            for (let i = 0; i < targetText.length; i++) {
                const char = targetText[i];
                const span = document.createElement('span');
                span.innerText = char === ' ' ? '␣' : char;
                
                if (i < charIndex) {
                    // Completed character
                    span.className = 'text-emerald-500 scale-95 transition-transform';
                } else if (i === charIndex) {
                    // Current active character
                    span.className = 'text-amber-500 underline decoration-wavy decoration-amber-400 underline-offset-8 scale-110 transition-transform animate-pulse';
                } else {
                    // Remaining characters
                    span.className = 'text-slate-300';
                }
                displayElem.appendChild(span);
            }

            // Highlight Target Key on Keyboard
            const nextChar = targetText[charIndex] ? targetText[charIndex].toLocaleUpperCase('tr-TR') : '';
            document.getElementById('next-key-hint').innerText = nextChar === ' ' ? 'BOŞLUK' : nextChar;
            highlightVirtualKey(nextChar);
        }

        function highlightVirtualKey(char) {
            document.querySelectorAll('.key-btn').forEach(btn => {
                btn.classList.remove('key-target');
            });

            if (!char) return;

            const targetBtn = document.querySelector(`.key-btn[data-key="${char}"]`);
            if (targetBtn) {
                targetBtn.classList.add('key-target');
            }
        }

        // Handle User Input Key
        function handleKeyPress(inputChar) {
            if (currentMode === 'game') {
                handleGameInput(inputChar);
                return;
            }

            const targetText = getCurrentItem();
            if (!targetText) return;

            const expectedChar = targetText[charIndex].toLocaleUpperCase('tr-TR');
            const pressedChar = inputChar.toLocaleUpperCase('tr-TR');

            if (pressedChar === expectedChar) {
                // Correct key pressed!
                playSound('correct');
                charIndex++;
                totalScore += 10;
                document.getElementById('score-count').innerText = totalScore;

                if (charIndex >= targetText.length) {
                    // Finished current word/item
                    charIndex = 0;
                    itemIndex++;

                    const group = DATA_SETS[currentMode][groupIndex];
                    if (itemIndex >= group.items.length) {
                        // Level Complete!
                        playSound('level');
                        showModal();
                        return;
                    }
                }
                renderCurrentTarget();
            } else {
                // Wrong key pressed
                playSound('wrong');
                const card = document.getElementById('practice-card');
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 400);
            }
        }

        // Voice Synth for Turkish Pronunciation
        function speakTarget() {
            if ('speechSynthesis' in window) {
                const text = getCurrentItem();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'tr-TR';
                utterance.rate = 0.8;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Balloon Game Mode Functions
        function startGame() {
            document.getElementById('game-start-overlay').classList.add('hidden');
            gameScore = 0;
            gameMissed = 0;
            balloons = [];
            gameActive = true;
            document.getElementById('game-score').innerText = gameScore;
            document.getElementById('game-missed').innerText = gameMissed;

            const balloonArea = document.getElementById('balloon-area');
            balloonArea.innerHTML = '';

            // Game loop
            clearInterval(gameInterval);
            clearInterval(spawnInterval);

            spawnInterval = setInterval(spawnBalloon, 1500);
            gameInterval = setInterval(updateBalloons, 40);
        }

        function stopGame() {
            gameActive = false;
            clearInterval(gameInterval);
            clearInterval(spawnInterval);
            document.getElementById('game-start-overlay').classList.remove('hidden');
        }

        const turkishAlphabet = "ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ";
        const balloonColors = ['bg-red-500', 'bg-blue-500', 'bg-emerald-500', 'bg-amber-500', 'bg-purple-500', 'bg-pink-500'];

        function spawnBalloon() {
            if (!gameActive) return;
            const balloonArea = document.getElementById('balloon-area');
            const randomChar = turkishAlphabet[Math.floor(Math.random() * turkishAlphabet.length)];
            const colorClass = balloonColors[Math.floor(Math.random() * balloonColors.length)];

            const balloon = document.createElement('div');
            const leftPos = Math.random() * 80 + 10; // 10% to 90%
            
            balloon.className = `balloon ${colorClass}`;
            balloon.style.left = `${leftPos}%`;
            balloon.style.bottom = `-100px`;
            balloon.innerHTML = `${randomChar}<div class="balloon-string"></div>`;
            balloon.dataset.char = randomChar;
            balloon.dataset.posY = -100;

            balloonArea.appendChild(balloon);
            balloons.push(balloon);
        }

        function updateBalloons() {
            if (!gameActive) return;

            for (let i = balloons.length - 1; i >= 0; i--) {
                const b = balloons[i];
                let posY = parseFloat(b.dataset.posY) + 2.2; // Speed
                b.dataset.posY = posY;
                b.style.bottom = `${posY}px`;

                // If balloon exits top of canvas
                if (posY > 380) {
                    b.remove();
                    balloons.splice(i, 1);
                    gameMissed++;
                    document.getElementById('game-missed').innerText = gameMissed;
                    playSound('wrong');

                    if (gameMissed >= 10) {
                        stopGame();
                        alert(`Oyun Bitti! Toplam Skorun: ${gameScore}`);
                    }
                }
            }
        }

        function handleGameInput(pressedChar) {
            const charUpper = pressedChar.toLocaleUpperCase('tr-TR');
            let hitIndex = -1;

            // Find lowest matching balloon
            for (let i = 0; i < balloons.length; i++) {
                if (balloons[i].dataset.char === charUpper) {
                    hitIndex = i;
                    break;
                }
            }

            if (hitIndex !== -1) {
                const hitBalloon = balloons[hitIndex];
                hitBalloon.classList.add('scale-150', 'opacity-0');
                playSound('correct');
                setTimeout(() => hitBalloon.remove(), 150);
                balloons.splice(hitIndex, 1);
                
                gameScore += 10;
                totalScore += 10;
                document.getElementById('game-score').innerText = gameScore;
                document.getElementById('score-count').innerText = totalScore;
            }
        }

        // Modal Helpers
        function showModal() {
            document.getElementById('success-modal').classList.remove('hidden');
        }

        function nextLevel() {
            document.getElementById('success-modal').classList.add('hidden');
            itemIndex = 0;
            charIndex = 0;
            
            const group = DATA_SETS[currentMode];
            if (groupIndex < group.length - 1) {
                groupIndex++;
            } else {
                groupIndex = 0; // Loop back or switch mode
            }
            renderCurrentTarget();
        }

        // Global Keyboard Event Listener
        window.addEventListener('keydown', (e) => {
            // Ignore system keys
            if (e.ctrlKey || e.altKey || e.metaKey) return;

            let key = e.key;
            if (key === 'Spacebar') key = ' ';

            // Single key filter
            if (key.length === 1) {
                e.preventDefault();
                handleKeyPress(key);

                // Visual button click simulation
                const virtualBtn = document.querySelector(`.key-btn[data-key="${key.toLocaleUpperCase('tr-TR')}"]`);
                if (virtualBtn) {
                    virtualBtn.classList.add('key-active');
                    setTimeout(() => virtualBtn.classList.remove('key-active'), 150);
                }
            }
        });

        // Touch / On-screen Key Click Listener
        document.querySelectorAll('.key-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const key = btn.getAttribute('data-key');
                handleKeyPress(key);
            });
        });

        // Initialize App
        window.onload = () => {
            renderCurrentTarget();
        };
    </script>
</body>
</html>
